name: crawl

on:
  # Không dùng `schedule` của GitHub: với repo này lịch chạy trễ hàng giờ (có lần 00:07 JST).
  # Cloudflare Worker (worker/crawl-trigger.js) gọi workflow_dispatch đúng giờ:
  # 30 phút một lần, 10:00–20:00 giờ Nhật. Đổi giờ thì sửa Cron Triggers của Worker và CRAWL_HOURS trong web/js/logic.js.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Dữ liệu crawl nằm ở nhánh `data` (một commit, ghi đè mỗi lần), không commit vào `main`.
      - name: Lấy dữ liệu từ nhánh data
        id: pull
        run: tools/sync-data.sh pull
      - name: Crawl giá iPhone
        run: python -m crawler.run --category iphone
      - name: Crawl giá Pokémon BOX
        if: always() && steps.pull.outcome == 'success'
        run: python -m crawler.run --category pokemon
      # Chỉ đẩy khi đã lấy được dữ liệu cũ; nếu không sẽ ghi đè nhánh data bằng dữ liệu thiếu.
      - name: Đẩy dữ liệu lên nhánh data
        if: always() && steps.pull.outcome == 'success'
        run: |
          git config user.name "kaitori-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/sync-data.sh push
