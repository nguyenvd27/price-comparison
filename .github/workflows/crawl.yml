name: crawl

on:
  # 30 phút một lần, 10:00–20:00 giờ Nhật (cron tính theo UTC = JST − 9).
  # Dùng phút :07/:37 thay vì :00/:30: GitHub hay trễ hoặc bỏ lịch chạy vào các mốc tròn đông người dùng.
  # Đổi giờ thì sửa cả CRAWL_HOURS trong web/js/logic.js.
  schedule:
    - cron: "7,37 1-10 * * *" # 10:07–19:37 JST
    - cron: "7 11 * * *"      # 20:07 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl giá iPhone
        run: python -m crawler.run --category iphone
      - name: Crawl giá Pokémon BOX
        if: always()
        run: python -m crawler.run --category pokemon
      - name: Commit dữ liệu nếu có thay đổi
        if: always()
        run: |
          git config user.name "kaitori-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "data: cập nhật giá $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          git pull --rebase
          git push
