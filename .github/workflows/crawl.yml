name: crawl

on:
  # 30 phút một lần, 10:00–20:00 giờ Nhật (cron tính theo UTC = JST − 9).
  # Đổi giờ thì sửa cả CRAWL_HOURS trong web/js/logic.js.
  schedule:
    - cron: "0,30 1-10 * * *" # 10:00–19:30 JST
    - cron: "0 11 * * *"      # 20:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl giá
        run: python -m crawler.run
      - name: Commit dữ liệu nếu có thay đổi
        if: always()
        run: |
          git config user.name "kaitori-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "data: cập nhật giá $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          git pull --rebase
          git push
