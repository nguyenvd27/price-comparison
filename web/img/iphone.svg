<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Minh hoạ iPhone">
  <!-- Minh hoạ tự vẽ (không phải ảnh của Apple): mặt lưng và mặt trước một chiếc điện thoại. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b2c50"/>
      <stop offset="1" stop-color="#5e1430"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#3b4a7a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- Mặt trước, nghiêng phía sau -->
  <g transform="rotate(-10 120 130)" filter="url(#shadow)">
    <rect x="62" y="36" width="104" height="196" rx="20" fill="#2b2b2f"/>
    <rect x="68" y="42" width="92" height="184" rx="15" fill="url(#screen)"/>
    <rect x="98" y="50" width="32" height="9" rx="4.5" fill="#0b0b0d"/>
    <rect x="78" y="78" width="72" height="10" rx="5" fill="#fff" opacity=".85"/>
    <rect x="78" y="96" width="48" height="7" rx="3.5" fill="#fff" opacity=".5"/>
    <g fill="#fff" opacity=".9">
      <rect x="78" y="150" width="18" height="18" rx="5"/>
      <rect x="105" y="150" width="18" height="18" rx="5" opacity=".7"/>
      <rect x="132" y="150" width="18" height="18" rx="5" opacity=".5"/>
      <rect x="78" y="178" width="18" height="18" rx="5" opacity=".6"/>
      <rect x="105" y="178" width="18" height="18" rx="5" opacity=".8"/>
      <rect x="132" y="178" width="18" height="18" rx="5" opacity=".4"/>
    </g>
  </g>

  <!-- Mặt lưng màu burgundy với cụm camera -->
  <g transform="rotate(8 210 120)" filter="url(#shadow)">
    <rect x="156" y="18" width="108" height="204" rx="22" fill="url(#back)"/>
    <rect x="156" y="18" width="54" height="204" rx="22" fill="url(#shine)"/>
    <rect x="168" y="30" width="58" height="58" rx="16" fill="#4a0f25" opacity=".85"/>
    <g fill="#141416" stroke="#3a3a40" stroke-width="3">
      <circle cx="184" cy="46" r="10"/>
      <circle cx="210" cy="46" r="10"/>
      <circle cx="184" cy="72" r="10"/>
    </g>
    <g fill="#5b7bd5" opacity=".7">
      <circle cx="184" cy="46" r="3.5"/>
      <circle cx="210" cy="46" r="3.5"/>
      <circle cx="184" cy="72" r="3.5"/>
    </g>
    <circle cx="210" cy="72" r="4" fill="#f1e3c0"/>
    <path d="M210 128c-4-6-15-6-15 3 0 8 15 17 15 17s15-9 15-17c0-9-11-9-15-3z" fill="#fff" opacity=".18"/>
  </g>
</svg>
