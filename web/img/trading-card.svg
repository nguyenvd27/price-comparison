<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Minh hoạ thẻ bài">
  <!-- Minh hoạ tự vẽ (không dùng nhân vật hay logo có bản quyền): một xấp thẻ bài hiếm. -->
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset=".35" stop-color="#ff7eb3"/>
      <stop offset=".65" stop-color="#7ac7ff"/>
      <stop offset="1" stop-color="#9dffb0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e9b42c"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bd3"/>
      <stop offset="1" stop-color="#1c3790"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Hai thẻ úp phía sau -->
  <g filter="url(#shadow)">
    <g transform="rotate(-16 110 130)">
      <rect x="62" y="40" width="120" height="168" rx="10" fill="url(#back)"/>
      <rect x="70" y="48" width="104" height="152" rx="7" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
      <circle cx="122" cy="124" r="22" fill="#fff" opacity=".2"/>
    </g>
    <g transform="rotate(14 220 130)">
      <rect x="150" y="40" width="120" height="168" rx="10" fill="url(#back)"/>
      <rect x="158" y="48" width="104" height="152" rx="7" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
      <circle cx="210" cy="124" r="22" fill="#fff" opacity=".2"/>
    </g>
  </g>

  <!-- Thẻ hiếm ở giữa -->
  <g transform="rotate(-2 160 124)" filter="url(#shadow)">
    <rect x="98" y="26" width="128" height="180" rx="10" fill="url(#frame)"/>
    <rect x="106" y="34" width="112" height="164" rx="6" fill="#fffaf0"/>
    <rect x="112" y="40" width="70" height="8" rx="4" fill="#3a3a3a" opacity=".75"/>
    <circle cx="206" cy="44" r="6" fill="#e9b42c"/>
    <rect x="112" y="54" width="100" height="70" rx="4" fill="url(#holo)"/>
    <path d="M162 64l7 14 15 2-11 10 3 15-14-8-14 8 3-15-11-10 15-2z" fill="#fff" opacity=".9"/>
    <rect x="112" y="132" width="100" height="6" rx="3" fill="#3a3a3a" opacity=".55"/>
    <rect x="112" y="144" width="84" height="6" rx="3" fill="#3a3a3a" opacity=".35"/>
    <rect x="112" y="156" width="92" height="6" rx="3" fill="#3a3a3a" opacity=".35"/>
    <rect x="112" y="176" width="40" height="12" rx="6" fill="#e9b42c" opacity=".8"/>
    <path d="M200 176l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#e9b42c"/>
  </g>

  <!-- Lấp lánh -->
  <g fill="#ffd84d">
    <path d="M60 52l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M270 190l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path d="M262 46l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#7ac7ff"/>
  </g>
</svg>
